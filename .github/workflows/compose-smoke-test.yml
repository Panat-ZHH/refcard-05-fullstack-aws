# Prueft, dass das lokale Gesamtsystem (docker-compose-local) mit Podman wirklich startet:
# Frontend + Backend + MariaDB + MinIO bauen, starten, gesund melden und End-to-End testen.
name: Compose Smoke-Test (lokale Entwicklung)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # woechentlich: faengt Breaking Changes in FE/BE-Repos ab

jobs:
  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refcard-05-fullstack-aws/docker-compose-local
    steps:
      # gleiche Ordnerstruktur wie lokal: alle drei Repos nebeneinander
      - uses: actions/checkout@v5
        with:
          path: refcard-05-fullstack-aws
      - uses: actions/checkout@v5
        with:
          repository: Panat-ZHH/refcard-05-be-springboot-businesstrips
          path: refcard-05-be-springboot-businesstrips
      - uses: actions/checkout@v5
        with:
          repository: Panat-ZHH/refcard-05-fe-react-vite
          path: refcard-05-fe-react-vite

      - name: podman-compose installieren
        run: |
          pipx install podman-compose
          podman --version && podman-compose --version

      - name: Gesamtsystem starten (wie ein Teammitglied es tun wuerde)
        run: ./start.sh

      - name: End-to-End-Checks
        run: |
          set -x
          curl -fsS http://localhost:8080/actuator/health | tee health.json | jq .
          jq -e '.status == "UP" and .components.db.status == "UP" and .components.imageStorage.status == "UP"' health.json
          jq -e '.components.db.details.database == "MariaDB"' health.json
          test "$(curl -fsS http://localhost:8080/v1/trips | jq length)" -ge 3
          curl -fsS -o img.jpg -w '%{content_type}\n' http://localhost:8080/v1/trips/1/image | grep '^image/'
          curl -fsS http://localhost:8080/v1/images | jq -e '.storage | startswith("s3://")'
          # Upload in den (MinIO-)Bucket und wieder lesen
          curl -fsS -X PUT -F file=@img.jpg http://localhost:8080/v1/trips/2/image | jq -e '.key == "trips/2"'
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/version.json | jq -e '.apiBaseUrl == "http://localhost:8080/"'
          curl -fsS -o /dev/null -D - -H 'Origin: http://localhost:3000' http://localhost:8080/v1/trips | grep -i 'access-control-allow-origin: http://localhost:3000'
          # Typ-Pruefung: kein Bild -> 415
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -F file=@/etc/hosts http://localhost:8080/v1/trips/2/image)" = 415

      - name: Logs bei Fehler
        if: failure()
        run: podman-compose logs --tail 200

      - name: Aufraeumen
        if: always()
        run: podman-compose down -v
