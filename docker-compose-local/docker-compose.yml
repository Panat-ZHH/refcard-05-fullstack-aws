# =============================================================================
# RefCard05 - Lokale Entwicklung mit Podman: Frontend + Backend + MariaDB + S3 (S3Mock)
#
#   ./start.sh                       # .env anlegen, bauen, starten, warten bis alles healthy ist
#   (manuell: cp .env.example .env && podman-compose up -d --build)
#
#   Frontend:    http://localhost:3000
#   Backend:     http://localhost:8080/v1/trips   (Health: /actuator/health)
#   S3 (Mock):   http://localhost:9090            (S3-API, z. B. http://localhost:9090/biztrips-images-local)
#   phpMyAdmin:  http://localhost:8082            (nur mit: podman-compose --profile tools up -d)
#
# Erwartete Ordnerstruktur (alle drei Repos nebeneinander klonen):
#   workspace/refcard-05-fe-react-vite
#   workspace/refcard-05-be-springboot-businesstrips
#   workspace/refcard-05-fullstack-aws/docker-compose-local   <- hier
# Andere Pfade: FRONTEND_CONTEXT / BACKEND_CONTEXT in .env setzen.
# Images aus Amazon ECR statt lokal bauen: ./use-ecr-images.sh <version>
# Die Datei folgt der Compose-Spezifikation -> funktioniert auch mit `podman compose` / Docker Compose.
# =============================================================================
name: biztrips

services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen (cp .env.example .env)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # S3-kompatibler Object Storage (Adobe S3Mock): gleicher Code-Pfad (S3ImageStorage) wie auf AWS,
  # nur anderer Endpoint. MinIO verteilt keine freien Container-Images mehr -> S3Mock.
  s3:
    image: docker.io/adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/s3mockroot
    healthcheck:
      # Image hat weder curl noch wget -> TCP-Check ueber bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../../refcard-05-be-springboot-businesstrips}
      args:
        VERSION: local
    image: localhost/biztrips-backend:local
    depends_on:
      mariadb:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb,s3
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://s3:9090
      S3_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      # nur fuer den lokalen S3-Ersatz (beliebige Werte) - auf AWS kommen die Rechte aus der ECS-Task-Rolle
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../refcard-05-fe-react-vite}
      args:
        # der Browser ruft das Backend direkt auf -> Host-Port
        VITE_API_BASE_URL: http://localhost:8080/
        VITE_APP_VERSION: local
    image: localhost/biztrips-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  phpmyadmin:
    image: docker.io/library/phpmyadmin:5
    profiles: ["tools"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
    ports:
      - "8082:80"

volumes:
  mariadb-data:
  s3-data:
